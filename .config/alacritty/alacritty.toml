[colors]
draw_bold_text_with_bright_colors = true

[font]
size = 11

[font.bold]
family = "JetBrains Mono Nerd Font Mono"
style = "Bold"

[font.italic]
family = "JetBrains Mono Nerd Font Mono"
style = "Italic"


[font.normal]
family = "JetBrains Mono Nerd Font Mono"
style = "Regular"

[[keyboard.bindings]]
action = "SpawnNewInstance"
key = "Return"
mods = "Control|Shift"



[env]
TERM = "xterm-256color"


# Spawn zsh explicitly. Relying on $SHELL is fragile: a graphical session
# started before `chsh` keeps the old value and hands every terminal bash.
[terminal.shell]
program = "/usr/bin/zsh"

[window]
opacity = 0.95
